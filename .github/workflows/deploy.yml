name: CI/CD Pipeline - Audio Classification

# Déclenchement automatique à chaque push sur la branche main
on:
  push:
    branches: [ "main" ]

jobs:
  # 1. PHASE CI : Intégration Continue (Vérification et Build Docker)
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code (Checkout)
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installation des dépendances système et Python
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Validation du Build Docker
      run: |
        docker build -f bloc5/Dockerfile -t audio-app:test .

  # 2. PHASE CD : Déploiement Continu sur le Cloud (Render)
  deploy:
    needs: build-and-test # Ne s'exécute que si la phase CI a réussi
    runs-on: ubuntu-latest

    steps:
    - name: Déclenchement du Webhook de déploiement Render
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"